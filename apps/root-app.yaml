apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prova
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/desotech-it/DSK213-PUBLIC.git
    targetRevision: main
    path: apps/nginx-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
